name: Backend (build and deploy)

on:
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/backend.yml"]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: backend-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
      - run: npx prisma generate
      - run: npm test --if-present
      - run: npm run build

      - name: Package release
        run: |
          tar -czf "$RUNNER_TEMP/release.tgz" dist package.json package-lock.json prisma $(ls prisma.config.* 2>/dev/null || true)

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Upload release to S3
        run: aws s3 cp "$RUNNER_TEMP/release.tgz" "s3://$ARTIFACT_BUCKET/api/$GITHUB_SHA.tgz"
        env:
          ARTIFACT_BUCKET: ${{ vars.ARTIFACT_BUCKET }}

      - name: Deploy on server (SSM Run Command)
        env:
          ARTIFACT_BUCKET: ${{ vars.ARTIFACT_BUCKET }}
          API_INSTANCE_NAME: ${{ vars.API_INSTANCE_NAME }}
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=$API_INSTANCE_NAME" "Name=instance-state-name,Values=running" \
            --query 'Reservations[0].Instances[0].InstanceId' --output text)
          if [ -z "$INSTANCE_ID" ] || [ "$INSTANCE_ID" = "None" ]; then
            echo "No running instance named $API_INSTANCE_NAME"; exit 1
          fi

          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --parameters commands="/usr/local/bin/deploy-api s3://$ARTIFACT_BUCKET/api/$GITHUB_SHA.tgz $GITHUB_SHA" \
            --timeout-seconds 900 \
            --query Command.CommandId --output text)

          while true; do
            sleep 10
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in
              Pending|InProgress|Delayed|Cancelling) ;;
              *) break ;;
            esac
          done

          echo "----- server output -----"
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query StandardOutputContent --output text
          echo "----- server errors -----"
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query StandardErrorContent --output text

          if [ "$STATUS" != "Success" ]; then
            echo "Deploy finished with status: $STATUS"
            exit 1
          fi
